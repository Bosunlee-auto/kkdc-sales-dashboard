<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KKDC Dashboard Login</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fafafa; color: #1a1d1f;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0;
  }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 32px 36px; width: 320px;
  }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 12px; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; margin-top: 14px; }
  input {
    width: 100%; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 6px;
    font-size: 14px; box-sizing: border-box;
  }
  button {
    width: 100%; margin-top: 20px; padding: 10px; border-radius: 6px; border: none;
    background: #1a1d1f; color: #fff; font-size: 14px; cursor: pointer;
  }
  .error { color: #dc2626; font-size: 12px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>KKDC Sales Dashboards</h1>
  <div class="sub">Log in with your Dashboard Access credentials</div>
  <label for="loginId">Login ID</label>
  <input type="text" id="loginId" autocomplete="username">
  <label for="pin">PIN</label>
  <input type="password" id="pin" autocomplete="current-password">
  <button id="loginBtn">Log in</button>
  <div class="error" id="error">Invalid login ID or PIN.</div>
</div>

<script>
// Maps a Dashboard_Access "Allowed_Dashboards" key to the page that serves it.
// Order here also defines priority when a user has multiple - whichever
// comes first in this list is where they land after login.
const DASHBOARD_URLS = {
  TOTAL_SALES: '/index.html',
  NY: '/ny-sales.html',
  NJ: '/nj-sales.html',
  TOTAL_INVOICE: '/total-invoice.html'
};

async function doLogin() {
  const loginId = document.getElementById('loginId').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ loginId, pin })
  });

  if (!res.ok) {
    errorEl.style.display = 'block';
    return;
  }

  const { allowedDashboards } = await res.json();
  const params = new URLSearchParams(window.location.search);
  const explicitNext = params.get('next');

  // If redirected here from a specific page (e.g. session expired mid-use),
  // honor that. Otherwise, land on the first dashboard this user is
  // actually allowed to see - not a hardcoded default that may 403 for
  // users without Total Sales access (e.g. NY-only or NJ-only accounts).
  let next = explicitNext;
  if (!next || next === '/index.html') {
    const firstAllowed = (allowedDashboards || []).find((key) => DASHBOARD_URLS[key]);
    next = firstAllowed ? DASHBOARD_URLS[firstAllowed] : '/index.html';
  }
  window.location.href = next;
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
